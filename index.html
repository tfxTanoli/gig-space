<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- .ico first, and as a real file: /favicon.ico is requested by name by
         crawlers and by Google's favicon fetcher, which decides the icon shown
         beside a search result. Without the file the SPA catch-all answered it
         with index.html, so that request found no icon at all. -->
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="96x96" href="/favicon-96.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />

    <!--seo-defaults-->
    <!-- Defaults for every page. Listing pages under /posts/ have these replaced
         server-side by api/post-page.ts with their own title, description and image. -->
    <meta name="description" content="Gigspace connects you with local service providers, freelancers and small businesses. Compare quotes, message sellers and book with confidence." />
    <link rel="canonical" href="https://gigspace.co/" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Gigspace" />
    <meta property="og:locale" content="en_US" />
    <meta property="og:url" content="https://gigspace.co/" />
    <meta property="og:title" content="Gigspace" />
    <meta property="og:description" content="Gigspace connects you with local service providers, freelancers and small businesses. Compare quotes, message sellers and book with confidence." />
    <meta property="og:image" content="https://gigspace.co/og-default.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Gigspace" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Gigspace" />
    <meta name="twitter:description" content="Gigspace connects you with local service providers, freelancers and small businesses." />
    <meta name="twitter:image" content="https://gigspace.co/og-default.png" />
    <!--/seo-defaults-->

    <!-- viewport-fit=cover exposes env(safe-area-inset-*): pinned headers pad
         themselves by exactly the status-bar space each device needs. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <!-- Match the browser/status-bar chrome to the app background on mobile. -->
    <meta name="theme-color" content="#0f172a" />
    <!-- Theme before first paint (GIG-73): the visitor's own choice if they made
         one, otherwise their device setting. Runs before any CSS applies, so a
         light-mode visitor never sees a flash of dark. src/theme.ts owns the
         same logic after load (toggle, following device changes). -->
    <script>
      (function () {
        var theme = 'dark';
        try {
          var saved = localStorage.getItem('gigspace-theme');
          if (saved === 'light' || saved === 'dark') theme = saved;
          else if (window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches) theme = 'light';
        } catch (e) {}
        var root = document.documentElement;
        root.classList.add(theme);
        root.style.colorScheme = theme;
        if (theme === 'light') {
          var m = document.querySelector('meta[name="theme-color"]');
          if (m) m.setAttribute('content', '#ffffff');
        }
      })();
    </script>
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />
    <title>Gigspace</title>


    <!-- Warm up the connections the first paint depends on so auth/db/storage
         requests don't pay TLS setup on the critical path. -->
    <link rel="preconnect" href="https://identitytoolkit.googleapis.com" crossorigin />
    <link rel="preconnect" href="https://securetoken.googleapis.com" crossorigin />
    <link rel="preconnect" href="https://gigspace-208b4-default-rtdb.firebaseio.com" crossorigin />
    <link rel="preconnect" href="https://firebasestorage.googleapis.com" crossorigin />

    <!-- Fonts, loaded non-render-blocking: preload the stylesheet then flip it to
         a real stylesheet on load. Text paints immediately in the system fallback
         and swaps to Inter when ready, instead of blocking first paint. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="preload"
      as="style"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      onload="this.onload=null;this.rel='stylesheet'"
    />
    <noscript>
      <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
    </noscript>
  </head>
  <body>
    <!-- Instant first-paint spinner. React's createRoot replaces #root's
         contents on mount, so this disappears the moment the app boots — it just
         fills the gap between the (render-blocking) CSS painting and the JS
         bundle finishing, instead of showing an empty dark screen. -->
    <div id="root">
      <div style="position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:var(--color-background,#0f172a)">
        <div style="width:2rem;height:2rem;border:2px solid #3b82f6;border-top-color:transparent;border-radius:9999px;animation:appboot-spin .7s linear infinite"></div>
      </div>
    </div>
    <style>@keyframes appboot-spin{to{transform:rotate(360deg)}}</style>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
